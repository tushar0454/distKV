name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: test (race detector)
        run: make test

      - name: build
        run: make build
